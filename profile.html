<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stitchers — Stitcher profile</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{--cream:#FAF7F2;--warm:#FFFDF9;--blush:#F2D9D0;--rose:#C4716A;--rose-d:#A0524A;--rose-l:#EAA99F;--plum:#4A2040;--plum-l:#7A3A60;--gold:#C9A84C;--sage:#6B8F71;--char:#2C2C2C;--mid:#666;--light:#999;--border:#E8E0D8;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--sh:0 2px 12px rgba(0,0,0,0.07);--shm:0 8px 32px rgba(0,0,0,0.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--char);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
nav{background:var(--plum);border-bottom:3px solid var(--rose);position:sticky;top:0;z-index:100;}
.ni{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.lm{width:32px;height:32px;background:var(--rose);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.lt{font-family:var(--serif);font-size:20px;font-weight:700;color:white;}
.nl{display:flex;align-items:center;gap:22px;}
.nl a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:13px;font-weight:500;}
.nc{display:flex;gap:10px;}
.bg{border:1.5px solid rgba(255,255,255,0.4);color:white;background:none;border-radius:100px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);text-decoration:none;}
.bp{background:var(--rose);color:white;border:none;border-radius:100px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);text-decoration:none;}
.wrap{max-width:1040px;margin:0 auto;padding:36px 24px 60px;flex:1;width:100%;}
.btn{background:var(--plum);color:white;border:none;border-radius:100px;padding:12px 26px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-block;}
.btn:hover{background:var(--plum-l);}
.btn-rose{background:var(--rose);}
.btn-outline{background:white;color:var(--plum);border:1.5px solid var(--plum);}
.card{background:var(--warm);border-radius:16px;border:1px solid var(--border);box-shadow:var(--sh);padding:26px;}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;}
.av{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--blush),var(--rose-l));border:4px solid white;box-shadow:var(--sh);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:40px;font-weight:700;color:var(--rose-d);}
.av img{width:100%;height:100%;object-fit:cover;}
.name{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--plum);line-height:1.2;}
.sub{font-size:14px;color:var(--mid);margin-top:4px;}
.pro{display:inline-block;background:var(--plum);color:white;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:0.05em;margin-top:8px;}
.price{text-align:right;font-size:13px;color:var(--mid);}
.price strong{display:block;font-family:var(--serif);font-size:26px;color:var(--plum);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{background:#F0EAF4;color:var(--plum);font-size:12px;font-weight:500;padding:4px 11px;border-radius:100px;}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;align-items:start;}
.h3{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--plum);margin-bottom:12px;}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--border);}
.empty{font-size:14px;color:var(--light);padding:14px 0;}
.review{padding:14px 0;border-bottom:1px solid var(--border);}
.review:last-child{border-bottom:none;}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
.rtxt{font-size:14px;color:var(--mid);margin-top:4px;line-height:1.6;}
.rmeta{font-size:12px;color:var(--light);margin-top:4px;}
.links a{display:block;font-size:14px;color:var(--plum);text-decoration:none;margin-bottom:8px;word-break:break-all;}
.note{background:#FDF6E3;border:1px solid var(--gold);color:#8B6914;border-radius:12px;padding:14px 18px;font-size:14px;margin-top:20px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;}
.overlay.show{display:flex;}
.modal{background:white;border-radius:16px;padding:28px;max-width:480px;width:100%;box-shadow:var(--shm);}
.modal h3{font-family:var(--serif);font-size:20px;color:var(--plum);margin-bottom:14px;}
.fi{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-family:var(--sans);font-size:14px;outline:none;margin-bottom:12px;}
.fi:focus{border-color:var(--plum);}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
.btn-ghost{background:var(--cream);color:var(--mid);border:1px solid var(--border);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.status{font-size:13px;margin-top:10px;}
.big{text-align:center;padding:70px 20px;}
.big .ico{font-size:48px;margin-bottom:12px;}
.big p{color:var(--mid);margin:8px 0 22px;}
footer{background:#2C2C2C;padding:40px 0 24px;}
.fi2{max-width:1200px;margin:0 auto;padding:0 24px;}
.fbt{border-top:1px solid rgba(255,255,255,0.08);padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.35);}
.maple{color:var(--rose);}
@media(max-width:820px){.head{grid-template-columns:1fr;text-align:center;}.av{margin:0 auto;}.price{text-align:center;}.grid{grid-template-columns:1fr;}.nl{display:none;}.photos{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<nav><div class="ni">
  <a href="home.html" class="logo"><div class="lm">🧵</div><span class="lt">Stitchers</span></a>
  <div class="nl"><a href="find.html">Find a Stitcher</a><a href="specialties.html">Specialties</a><a href="how-it-works.html">How It Works</a><a href="post-project.html">Post a Project</a></div>
  <div class="nc" id="nc"><a class="bg" href="index.html">Sign In</a><a class="bp" href="index.html">Join Free</a></div>
</div></nav>

<div class="wrap" id="app" data-no-i18n>
  <div class="big"><p>Loading…</p></div>
</div>

<div class="overlay" id="msg-overlay">
  <div class="modal">
    <h3 id="msg-title"></h3>
    <input class="fi" id="msg-subject" maxlength="120">
    <textarea class="fi" id="msg-body" rows="5" style="resize:vertical;"></textarea>
    <div class="row">
      <button class="btn-ghost" onclick="closeMsg()" id="msg-cancel"></button>
      <button class="btn" id="msg-send" onclick="sendMsg()"></button>
    </div>
    <div class="status" id="msg-status"></div>
  </div>
</div>

<div class="overlay" id="lightbox" onclick="this.classList.remove('show')" style="cursor:zoom-out;">
  <img id="lightbox-img" style="max-width:92vw;max-height:88vh;border-radius:12px;">
</div>

<footer><div class="fi2">
  <div class="fbt"><span>© 2026 Stitchers Canada Inc. All rights reserved. Made with <span class="maple">♥</span> in Canada.</span><span>English · Français</span></div>
</div></footer>

<script>
const SB_URL  = 'https://juyljsaqqkymtfvlftgo.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1eWxqc2FxcWt5bXRmdmxmdGdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTgzNDEsImV4cCI6MjEwNzU3NDM0MX0.3ZU35hBkfctK085y7160peLDqNxkzoo97hVumd06fuo';
const sb = supabase.createClient(SB_URL, SB_ANON);

let pid = new URLSearchParams(location.search).get('id');
const handleParam = (new URLSearchParams(location.search).get('h') || '').toLowerCase();
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let lang = localStorage.getItem('stitchers_lang') || 'en';
let S = { me: null, p: null, specs: [], photos: [], reviews: [], names: {}, loaded: false };

const T = {
  en: { notFound:'We could not find this stitcher.', sample:'This is an example listing. Real stitcher profiles will appear here.', back:'Back to search', message:'Message this stitcher', signin:'Sign in to message', edit:'Edit your profile', from:'From', hr:'/hr', quote:'Quote on request', specialties:'Specialties', portfolio:'Portfolio', nophotos:'No portfolio photos yet.', reviews:'Reviews', noreviews:'No reviews yet.', contact:'Contact', about:'About', pro:'Pro Stitcher', noloc:'Location not set', subject:'Subject (optional)', body:'Your message', send:'Send message', cancel:'Cancel', title:'Message', sending:'Sending…', sent:'Message sent. They will see it in their inbox.', err:'Could not send: ', self:"You can't message yourself.", need:'Please write a message first.', client:'Client', reviewsCount:'reviews', website:'Website', instagram:'Instagram' },
  fr: { notFound:'Nous n\'avons pas trouvé cette couturière.', sample:'Ceci est un exemple. Les vrais profils de couturières apparaîtront ici.', back:'Retour à la recherche', message:'Écrire à cette couturière', signin:'Connectez-vous pour écrire', edit:'Modifier votre profil', from:'À partir de', hr:'/h', quote:'Soumission sur demande', specialties:'Spécialités', portfolio:'Portfolio', nophotos:'Aucune photo de portfolio pour l\'instant.', reviews:'Avis', noreviews:'Aucun avis pour l\'instant.', contact:'Coordonnées', about:'À propos', pro:'Couturière Pro', noloc:'Emplacement non indiqué', subject:'Sujet (facultatif)', body:'Votre message', send:'Envoyer le message', cancel:'Annuler', title:'Message', sending:'Envoi…', sent:'Message envoyé. La couturière le verra dans sa boîte de réception.', err:'Impossible d\'envoyer : ', self:'Vous ne pouvez pas vous écrire à vous-même.', need:'Veuillez d\'abord écrire un message.', client:'Cliente', reviewsCount:'avis', website:'Site web', instagram:'Instagram' }
};
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;

// Specialties are stored in English with an emoji; show them in the current language
const SPEC_FR = { 'Bridal':'Mariage et tenues de soirée', 'Alterations':'Retouches', 'Custom':'Création sur mesure', 'Restoration':'Restauration', 'Costumes':'Costumes', 'Knitwear':'Tricot', 'Menswear':'Vêtements pour hommes', 'Childrenswear':'Vêtements pour enfants', 'Upcycling':'Surcyclage', 'Home':'Textiles pour la maison' };
function specLabel(raw) {
  const clean = raw.replace(/^\p{Extended_Pictographic}\s*/u, '').trim();
  if (lang === 'fr') {
    const key = Object.keys(SPEC_FR).find(k => clean.includes(k));
    if (key) return SPEC_FR[key];
  }
  return clean;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
const dateStr = d => new Date(d).toLocaleDateString(lang === 'fr' ? 'fr-CA' : 'en-CA', { year:'numeric', month:'short', day:'numeric' });

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  S.me = session ? session.user : null;
  updateNav();

  if (!pid && handleParam) {
    const { data: byHandle } = await sb.from('profiles').select('id').eq('handle', handleParam).maybeSingle();
    if (byHandle) pid = byHandle.id;
  }
  if (!pid || !UUID.test(pid)) { S.loaded = true; return render(); }

  const { data: p } = await sb.from('profiles').select('*').eq('id', pid).maybeSingle();
  if (!p) { S.loaded = true; return render(); }
  S.p = p;

  const [specs, photos, reviews] = await Promise.all([
    sb.from('stitcher_specialties').select('specialty').eq('profile_id', pid),
    sb.from('portfolio_photos').select('*').eq('profile_id', pid).order('display_order'),
    sb.from('reviews').select('*').eq('stitcher_id', pid).order('created_at', { ascending: false })
  ]);
  S.specs = specs.data || [];
  S.photos = photos.data || [];
  S.reviews = reviews.data || [];

  const ids = [...new Set(S.reviews.map(r => r.client_id))];
  if (ids.length) {
    const { data: names } = await sb.from('profiles').select('id, first_name, last_name').in('id', ids);
    (names || []).forEach(n => S.names[n.id] = [n.first_name, n.last_name].filter(Boolean).join(' ') || t('client'));
  }
  S.loaded = true;
  render();
}

function updateNav() {
  const nc = document.getElementById('nc');
  if (S.me) {
    const n = S.me.user_metadata?.first_name || 'My Account';
    nc.innerHTML = `<a class="bg" href="dashboard.html">${esc(n)}'s Dashboard</a><button class="bp" onclick="signOut()">Sign Out</button>`;
  }
}
async function signOut() { await sb.auth.signOut(); location.href = 'home.html'; }

function render() {
  const app = document.getElementById('app');
  if (!S.loaded) return;

  if (!S.p) {
    const sampleHint = pid && !UUID.test(pid) ? `<p>${t('sample')}</p>` : '';
    app.innerHTML = `<div class="card big"><div class="ico">🔍</div><div class="h3" style="justify-content:center;">${t('notFound')}</div>${sampleHint}<a class="btn" href="find.html">${t('back')}</a></div>`;
    return;
  }

  const p = S.p;
  const name = p.business_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Stitchers';
  const initial = esc(name.trim()[0] || '?').toUpperCase();
  const loc = [p.city, p.province].filter(Boolean).join(', ') || t('noloc');
  const isPro = p.plan === 'pro' || p.plan === 'studio';
  const isMe = S.me && S.me.id === pid;
  const avg = S.reviews.length ? S.reviews.reduce((a, r) => a + r.rating, 0) / S.reviews.length : null;

  let action;
  if (isMe) action = `<a class="btn btn-outline" href="dashboard.html">${t('edit')}</a>`;
  else if (!S.me) action = `<a class="btn btn-rose" href="index.html">${t('signin')}</a>`;
  else action = `<button class="btn btn-rose" onclick="openMsg()">${t('message')}</button>`;

  const priceBlock = p.hourly_rate
    ? `<div class="price">${t('from')}<strong>$${esc(p.hourly_rate)}${t('hr')}</strong></div>`
    : `<div class="price"><strong style="font-size:18px;">${t('quote')}</strong></div>`;

  const links = [];
  if (p.website) links.push(`<a href="${esc(/^https?:/.test(p.website) ? p.website : 'https://' + p.website)}" target="_blank" rel="noopener">${t('website')}: ${esc(p.website)}</a>`);
  if (p.instagram) links.push(`<a href="https://instagram.com/${esc(p.instagram.replace(/^@/, ''))}" target="_blank" rel="noopener">${t('instagram')}: @${esc(p.instagram.replace(/^@/, ''))}</a>`);

  app.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="av">${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="${esc(name)}" onerror="this.parentElement.textContent='${initial}'">` : initial}</div>
        <div>
          <div class="name">${esc(name)}</div>
          ${p.handle ? `<div class="sub">@${esc(p.handle)}</div>` : ''}
          <div class="sub">📍 ${esc(loc)}${avg ? ` · <span class="stars">${stars(avg)}</span> ${avg.toFixed(1)} (${S.reviews.length} ${t('reviewsCount')})` : ''}</div>
          ${isPro ? `<span class="pro">${t('pro')}</span>` : ''}
          ${S.specs.length ? `<div class="tags">${S.specs.map(s => `<span class="tag">${esc(specLabel(s.specialty))}</span>`).join('')}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;">
          ${priceBlock}
          ${action}
        </div>
      </div>
    </div>

    <div class="grid">
      <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="card">
          <div class="h3">${t('about')}</div>
          <p style="color:var(--mid);line-height:1.75;">${esc(p.bio || '')}</p>
        </div>
        <div class="card">
          <div class="h3">${t('portfolio')}</div>
          ${S.photos.length
            ? `<div class="photos">${S.photos.map(ph => `<img src="${esc(ph.photo_url)}" alt="${esc(ph.caption || name)}" loading="lazy" onclick="zoom('${esc(ph.photo_url)}')">`).join('')}</div>`
            : `<div class="empty">${t('nophotos')}</div>`}
        </div>
        <div class="card">
          <div class="h3">${t('reviews')}</div>
          ${S.reviews.length
            ? S.reviews.map(r => `
              <div class="review">
                <div class="stars">${stars(r.rating)}</div>
                ${r.review_text ? `<div class="rtxt">${esc(r.review_text)}</div>` : ''}
                <div class="rmeta">${esc(S.names[r.client_id] || t('client'))} · ${dateStr(r.created_at)}</div>
              </div>`).join('')
            : `<div class="empty">${t('noreviews')}</div>`}
        </div>
      </div>
      <div class="card links">
        <div class="h3">${t('contact')}</div>
        ${links.length ? links.join('') : `<div class="empty">${t('message')}</div>`}
      </div>
    </div>`;
}

function openMsg() {
  document.getElementById('msg-title').textContent = t('title') + ' — ' + (S.p.business_name || S.p.first_name || '');
  document.getElementById('msg-subject').placeholder = t('subject');
  document.getElementById('msg-body').placeholder = t('body');
  document.getElementById('msg-send').textContent = t('send');
  document.getElementById('msg-cancel').textContent = t('cancel');
  document.getElementById('msg-status').textContent = '';
  document.getElementById('msg-overlay').classList.add('show');
}
function closeMsg() { document.getElementById('msg-overlay').classList.remove('show'); }

async function sendMsg() {
  const body = document.getElementById('msg-body').value.trim();
  const subject = document.getElementById('msg-subject').value.trim();
  const status = document.getElementById('msg-status');
  if (!S.me) { location.href = 'index.html'; return; }
  if (S.me.id === pid) { status.style.color = 'var(--rose)'; status.textContent = t('self'); return; }
  if (!body) { status.style.color = 'var(--rose)'; status.textContent = t('need'); return; }
  const btn = document.getElementById('msg-send');
  btn.disabled = true; btn.textContent = t('sending');
  const { error } = await sb.from('messages').insert({
    sender_id: S.me.id, recipient_id: pid, subject: subject || null, message_text: body, is_read: false
  });
  btn.disabled = false; btn.textContent = t('send');
  if (error) { status.style.color = 'var(--rose)'; status.textContent = t('err') + error.message; return; }
  status.style.color = 'var(--sage)';
  status.textContent = t('sent');
  document.getElementById('msg-body').value = '';
  document.getElementById('msg-subject').value = '';
}

function zoom(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('show');
}

// Re-draw in the new language when the EN/FR switch is clicked
window.addEventListener('langchange', e => {
  lang = e.detail;
  render();
});

load();
</script>
<script src="i18n.js"></script>
</body>
</html>
